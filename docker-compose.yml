services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: networkmind
      POSTGRES_USER: networkmind
      POSTGRES_PASSWORD: networkmind_local
    ports: ["${POSTGRES_HOST_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networkmind -d networkmind"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["networkmind_postgres:/var/lib/postgresql/data"]
volumes:
  networkmind_postgres:

